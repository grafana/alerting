name: Build and Push Docker Image

# Builds the alerting Docker images via the Makefile and pushes them to the
# docker-alerting-prod Artifact Registry repo, then (eventually) triggers an
# Argo deploy.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.*"
      - "**/go.mod"
      - "**/go.sum"
      - "apps/historian/Dockerfile"
      - "Makefile"
      - ".github/workflows/build-push.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true # Don't block builds if tests fail
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          "go-version-file": "go.mod"
      - name: Run tests
        run: make test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.get-image-tag.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
          # image-tag derives the tag from git metadata, so we need full history.
          fetch-depth: 0
      - name: Log in to GAR
        uses: grafana/shared-workflows/actions/login-to-gar@00646b30431b955ec3c00982b23b1eeb7b66445b # login-to-gar/v1.0.0
        id: login-to-gar
        with:
          registry: "us-docker.pkg.dev"
          environment: "prod"
      - name: Build Docker images
        run: |
          make build-docker-images
      - name: Push Docker images to GAR
        run: |
          make push-images-prod-registry
      - name: Get image tag
        id: get-image-tag
        run: |
          IMAGE_TAG=$(make docker-image-tag)
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"